<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>破邪ノ剣閃・迷宮伝</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Sawarabi+Mincho&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --washi-bg: #f5f2e9;
            --sumi-black: #1a1a1a;
            --gold-accent: #d4af37;
            --blood-red: #8b0000;
            --wood-brown: #3e2723;
            --magic-blue: #00f2ff;
            --ui-font: 'Sawarabi Mincho', serif;
            --title-font: 'Noto Serif JP', serif;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--sumi-black);
            font-family: var(--ui-font);
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            transition: transform 0.1s;
        }

        .item-btn {
            background: #e0f2f1;
            border: 1px solid #00796b;
            padding: 2px 8px;
            font-size: 0.85em;
            cursor: pointer;
            border-radius: 4px;
            margin-left: 5px;
        }

        .item-btn:disabled {
            background: #eee;
            border-color: #ccc;
            cursor: default;
        }

        #three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        @keyframes shake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-3px, -2px) rotate(-1deg);
            }

            20% {
                transform: translate(-5px, 0px) rotate(1deg);
            }

            30% {
                transform: translate(5px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-1deg);
            }

            100% {
                transform: translate(0, 0) rotate(0deg);
            }
        }

        .shake {
            animation: shake 0.4s;
        }

        @keyframes slice-upper {
            0% {
                transform: translateY(0) rotate(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-120px) rotate(-15deg);
                opacity: 0;
            }
        }

        @keyframes slice-lower {
            0% {
                transform: translateY(0) rotate(0);
                opacity: 1;
            }

            100% {
                transform: translateY(120px) rotate(15deg);
                opacity: 0;
            }
        }

        .slice-upper {
            animation: slice-upper 0.8s forwards ease-in;
            clip-path: inset(0 0 50% 0);
            position: absolute;
        }

        .slice-lower {
            animation: slice-lower 0.8s forwards ease-in;
            clip-path: inset(50% 0 0 0);
            position: absolute;
        }

        @keyframes slash {
            0% {
                transform: scaleX(0) rotate(-45deg);
                opacity: 1;
            }

            50% {
                transform: scaleX(1.5) rotate(-45deg);
                opacity: 1;
            }

            100% {
                transform: scaleX(1.5) rotate(-45deg);
                opacity: 0;
            }
        }

        #clear-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            opacity: 0;
        }

        .fade-in-clear {
            display: flex !important;
            animation: fadeInClear 4s forwards ease-in-out;
        }

        @keyframes fadeInClear {
            0% { opacity: 0; }
            30% { opacity: 1; }
            100% { opacity: 1; }
        }

        #clear-title {
            font-size: 4em;
            color: var(--gold-accent);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
            margin-bottom: 30px;
            letter-spacing: 5px;
        }

        #clear-msg {
            font-size: 1.5em;
            line-height: 1.8;
            max-width: 80%;
        }

        .slash-line {
            position: absolute;
            width: 140%;
            height: 4px;
            background: #fff;
            box-shadow: 0 0 15px #fff;
            z-index: 1600;
            pointer-events: none;
            left: -20%;
            top: 50%;
            animation: slash 0.3s forwards;
            transform-origin: center;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .hud-panel {
            background: rgba(245, 242, 233, 0.9);
            border: 3px solid var(--wood-brown);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            padding: 15px;
            pointer-events: auto;
            position: relative;
        }

        .hud-panel::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid var(--gold-accent);
            pointer-events: none;
        }

        h2,
        h3 {
            font-family: var(--title-font);
            margin: 0;
            color: var(--wood-brown);
            text-align: center;
            border-bottom: 2px solid var(--gold-accent);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        button {
            background: var(--washi-bg);
            border: 2px solid var(--wood-brown);
            padding: 8px;
            cursor: pointer;
            font-family: var(--ui-font);
            transition: all 0.2s;
        }

        button:hover {
            background: var(--gold-accent);
            color: white;
        }

        #volume-control {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 2000;
            pointer-events: auto;
            color: var(--gold-accent);
            font-size: 0.8em;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid var(--gold-accent);
        }

        input[type=range] {
            cursor: pointer;
            accent-color: var(--gold-accent);
        }

        #town-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            background-image: url('assets/town_bg.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
        }

        #town-overlay-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 501;
        }

        #town-menu {
            width: 450px;
            z-index: 502;
            position: relative;
        }

        #battle-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #555 0%, #000 100%);
            display: none;
            z-index: 400;
            padding: 20px;
            box-sizing: border-box;
        }

        #battle-ui-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #battle-main-area {
            position: relative;
            top: -30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 420px;
        }

        #enemy-visual {
            width: 380px;
            height: 380px;
            background: rgba(0, 0, 0, 0.3);
            /* 白背景による透過時の幽霊現象を防ぐため黒系透過へ */
            border: 3px solid var(--gold-accent);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
        }

        #enemy-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            filter: brightness(2.2) contrast(1.2) drop-shadow(0 0 5px rgba(255, 255, 255, 0.4));
        }

        #transition-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 3000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s;
        }

        #status-location {
            font-size: 0.9em;
            color: var(--gold-accent);
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
        }

        #top-ui {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            pointer-events: none;
            z-index: 2000;
        }

        #enemy-name-plate {
            position: absolute;
            top: -15px;
            background: var(--blood-red);
            color: white;
            padding: 6px 30px;
            font-family: var(--title-font);
            border: 2px solid var(--gold-accent);
            z-index: 1500;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        #battle-commands {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        #status-window {
            width: 280px;
            pointer-events: auto;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .bar-container {
            width: 100%;
            height: 8px;
            background: #ccc;
            border: 1px solid #000;
            margin-top: 2px;
            margin-bottom: 6px;
        }

        .bar {
            height: 100%;
            transition: width 0.3s;
        }

        #hp-bar {
            background: var(--blood-red);
        }

        #mp-bar {
            background: #008;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-top: 5px;
            font-size: 0.95em;
            color: var(--blood-red);
        }

        #minimap-container {
            width: 150px;
            height: 150px;
            border: 3px solid var(--wood-brown);
            pointer-events: auto;
            background: #000;
            position: relative;
            margin-top: 50px;
        }

        #full-map-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: var(--washi-bg);
        }

        #full-map-canvas {
            border: 2px solid var(--gold-accent);
            background: #111;
        }

        #facility-modal,
        #confirm-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 480px;
            display: none;
            z-index: 2100;
        }

        .item-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .town-option {
            margin: 8px 0;
            padding: 12px;
            font-size: 1.1em;
            display: block;
            width: 100%;
        }

        #battle-dialogue-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2500;
            display: none;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 50px;
            pointer-events: auto;
        }

        #battle-dialogue-box {
            width: 600px;
            background: rgba(10, 10, 10, 0.95);
            border: 3px solid var(--gold-accent);
            padding: 30px;
            color: #fff;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            cursor: pointer;
        }

        #battle-dialogue-name {
            position: absolute;
            top: -25px;
            left: 20px;
            background: var(--blood-red);
            padding: 5px 25px;
            border: 2px solid var(--gold-accent);
            font-family: var(--title-font);
            font-size: 1.2em;
        }

        #battle-dialogue-text {
            font-size: 1.4em;
            line-height: 1.7;
            min-height: 2.5em; /* 2行分の高さを確保 */
        }

        .click-prompt {
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 0.8em;
            color: var(--gold-accent);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* バーチャルコントローラーのボタン */
        .controller-btn {
            width: 75px;
            height: 75px;
            background: rgba(30, 30, 30, 0.75);
            border: 2px solid var(--gold-accent);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 5px 8px rgba(0,0,0,0.35);
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
        }
        .controller-btn:active {
            background: rgba(181, 142, 66, 0.9);
            transform: scale(0.95);
            border-color: #fff;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div id="transition-overlay"></div>
        <div id="three-container"></div>
        <div id="volume-control"><span>奏(音量)</span><input type="range" id="volume-slider" min="0" max="0.5" step="0.01"
                value="0.15"></div>

        <div id="ui-layer">
            <div id="top-ui">
                <div id="status-window" class="hud-panel">
                    <h3 id="status-location">宿場町</h3>
                    <div class="status-row"
                        style="color: var(--gold-accent); font-weight: bold; border-bottom: 1px solid #ddd; margin-bottom: 5px;">
                        <span>段位：</span><span id="level-text">1</span>
                    </div>
                    <div class="status-row"><span>体力</span><span id="hp-text">100/100</span></div>
                    <div class="bar-container">
                        <div id="hp-bar" class="bar" style="width: 100%;"></div>
                    </div>
                    <div class="status-row"><span>気力</span><span id="mp-text">50/50</span></div>
                    <div class="bar-container">
                        <div id="mp-bar" class="bar" style="width: 100%;"></div>
                    </div>
                    <div class="status-row" style="font-size: 0.85em; color: #666;">
                        <span>功徳：</span><span id="exp-text">0 / 20</span>
                    </div>
                    <div class="stat-grid">
                        <div>攻撃：<span id="stat-atk">15</span></div>
                        <div>防御：<span id="stat-def">0</span></div>
                    </div>
                    <div id="equipment-area"
                        style="margin-top: 8px; padding-top: 8px; border-top: 2px solid var(--gold-accent); font-size: 0.9em;">
                        <div class="status-row"><span>右腕：</span><span id="weapon-name">竹光</span></div>
                        <div class="status-row"><span>胴体：</span><span id="armor-name">素浪人の着物</span></div>
                        <div class="status-row" style="margin-top:5px; border-top: 1px dashed #aaa; padding-top:3px;">
                            <span>所持：</span><span id="money-text">200</span> 文
                        </div>
                        <div id="yakumari-row" class="status-row" style="margin-top:5px; display:none;">
                            <span>丸薬：</span><span id="item-yakumari-count">0</span>
                            <button id="use-yakumari-btn" class="item-btn" onclick="useItem('yakumari')">使用</button>
                        </div>
                        <div id="myouyaku-row" class="status-row" style="display:none;">
                            <span>妙薬：</span><span id="item-myouyaku-count">0</span>
                            <button id="use-myouyaku-btn" class="item-btn" onclick="useItem('myouyaku')">使用</button>
                        </div>
                    </div>
                </div>
                <div id="minimap-container"><canvas id="minimap-canvas" width="150" height="150"></canvas></div>
            </div>
            <div id="exploration-log" class="hud-panel"
                style="height: 100px; width: 350px; overflow-y: hidden; display: flex; flex-direction: column-reverse; margin-left: auto; z-index: 2000;">
                <div class="log-entry">闇を晴らせ。敵の気配を逃すな。</div>
            </div>
            <div id="town-overlay">
                <div id="town-overlay-mask"></div>
                <div id="town-menu" class="hud-panel">
                    <h2>宿場町</h2>
                    <button class="town-option" onclick="openFacility('magistrate')">奉行所へ行く</button>
                    <button class="town-option" onclick="openFacility('inn')">宿屋で休む(20文)</button>
                    <button class="town-option" onclick="openFacility('shop')">商店に寄る</button>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <button class="town-option" style="background: #263238; color: #fff; margin: 8px 0;"
                            onclick="openConfirm('冒険の記録を綴りますか？', saveGame)">記録を綴る</button>
                        <button id="load-game-btn" class="town-option"
                            style="background: #3e2723; color: #fff; margin: 8px 0;"
                            onclick="openConfirm('以前の記憶を呼び覚ましますか？', loadGame)">以前の旅から</button>
                    </div>
                    <button id="enter-dungeon-btn" class="town-option"
                        style="background: var(--blood-red); color: white;"
                        onclick="showDungeonSelect()">討伐へ向かう</button>
                    <button class="town-option" style="background: #4a3c31; color: #fff; margin-top: 10px; font-size: 0.9em; padding: 6px;"
                        onclick="openFacility('credit')">製作者一覧 (クレジット)</button>
                </div>
            </div>

            <div id="dungeon-select-modal" class="hud-panel"
                style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); z-index:2000; min-width:300px;">
                <h2>―― 討伐地選択 ――</h2>
                <button class="town-option" onclick="enterDungeon('town')">1. 治安の悪い下町</button>
                <button id="forest-select-btn" class="town-option" onclick="enterDungeon('forest')"
                    style="display:none; color: #2e7d32; border-color: #2e7d32;">2. 野盗のすむ森</button>
                <button id="house-select-btn" class="town-option" onclick="enterDungeon('house')"
                    style="display:none; color: #5d4037; border-color: #5d4037;">3. 妖怪屋敷</button>
                <button id="castle-select-btn" class="town-option" onclick="enterDungeon('castle')"
                    style="display:none; color: #455a64; border-color: #455a64;">4. 鬼の住む廃城</button>
                <button id="abyss-select-btn" class="town-option" onclick="enterDungeon('abyss')"
                    style="display:none; color: #311b92; border-color: #311b92;">5. 奈落洞窟</button>
                <button class="town-option" style="background:#666; color:white;"
                    onclick="closeDungeonSelect()">戻る</button>
            </div>

            <!-- 画面左下のバーチャル操作パネル -->
            <div id="virtual-controller" style="display: none; position: absolute; bottom: 25px; left: 25px; z-index: 2500; pointer-events: auto;">
                <div style="display: flex; flex-direction: column; gap: 10px; width: 245px;">
                    <!-- 「前」ボタン (地図と同じ横長245px) -->
                    <button class="controller-btn" style="width: 245px; height: 68px; background: rgba(45, 45, 45, 0.85);" onmousedown="movePlayer('w')" ontouchstart="movePlayer('w'); event.preventDefault();">前 (前進)</button>
                    
                    <!-- 「左」「後」「右」ボタン -->
                    <div style="display: grid; grid-template-columns: repeat(3, 75px); gap: 10px;">
                        <button class="controller-btn" onmousedown="movePlayer('a')" ontouchstart="movePlayer('a'); event.preventDefault();">左</button>
                        <button class="controller-btn" onmousedown="movePlayer('s')" ontouchstart="movePlayer('s'); event.preventDefault();">後</button>
                        <button class="controller-btn" onmousedown="movePlayer('d')" ontouchstart="movePlayer('d'); event.preventDefault();">右</button>
                    </div>
                    
                    <!-- 「地図を開く」ボタン -->
                    <button id="map-btn" class="controller-btn" 
                        style="width: 245px; height: 68px; background: rgba(181, 142, 66, 0.7); border: 2px solid var(--gold-accent);"
                        onmousedown="showMap(true)" ontouchstart="showMap(true); event.preventDefault();"
                        onmouseup="showMap(false)" ontouchend="showMap(false); event.preventDefault();"
                        onmouseleave="showMap(false)">
                        地図を開く
                    </button>
                </div>
            </div>

            <div id="battle-overlay" style="display:none;">
                <div id="battle-ui-container">
                    <div id="battle-main-area">
                        <div id="enemy-name-plate">敵の名前</div>
                        <div id="enemy-visual"><img id="enemy-img" src="" alt="敵"></div>
                        <div id="battle-commands" class="hud-panel">
                            <button class="town-option" onclick="battleAction('attack')">斬る (攻撃)</button>
                            <button class="town-option" onclick="battleAction('defend')">凌ぐ (防御)</button>
                            <button class="town-option" onclick="battleAction('skill')">秘技 (気力体力10)</button>
                            <button class="town-option" onclick="battleAction('run')">逃走</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ボス台詞演出用レイヤー -->
            <div id="battle-dialogue-overlay">
                <div id="battle-dialogue-box" class="hud-panel">
                    <div id="battle-dialogue-name">名前</div>
                    <div id="battle-dialogue-text">台詞がここに入ります。</div>
                    <div class="click-prompt">▼ クリックで次へ</div>
                </div>
            </div>

            <div id="full-map-overlay">
                <h3 id="full-map-title">―― 治安の悪い下町 地図 ――</h3>
                <canvas id="full-map-canvas" width="400" height="400"></canvas>
                <p style="margin-top:10px;">[Spaceキーを離して閉じる]</p>
                <small>※赤印:現在地 / ⌂:宿場町</small>
            </div>

            <div id="facility-modal" class="hud-panel">
                <h2 id="modal-title">施設</h2>
                <p id="modal-text">...</p>

            class AudioManager {

                    this.bgms = {}; this.currentBGMType = null;
                    this.bgmPaths = {
                        'town': 'assets/bgm_town.mp3',
                        'dungeon': 'assets/bgm_dungeon1.mp3',
                        'battle': 'assets/bgm_battle1.mp3',
                        'boss': 'assets/bgm_battle2.mp3',
                        'forest': 'assets/bgm_dungeon2.mp3',
                        'house': 'assets/bgm_dungeon3.mp3',
                        'castle': 'assets/bgm_dungeon4.mp3',
                        'abyss': 'assets/bgm_dungeon5.mp3',
                        'battle3': 'assets/bgm_battle3.mp3',
                        'battle4': 'assets/bgm_battle4.mp3'
                    };
                }
                init() {
                    if (this.ctx) {
                        if (this.ctx.state === 'suspended') this.ctx.resume();
                        return;
                    }
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.connect(this.ctx.destination);
                    this.updateVolume(this.volume);
                }
                updateVolume(v) {
                    this.volume = v;
                    if (this.masterGain) this.masterGain.gain.setTargetAtTime(v, this.ctx.currentTime, 0.1);
                    Object.values(this.bgms).forEach(audio => { audio.volume = v; });
                }
                playKoto(freq, duration, vol = 0.3, offset = 0, attack = 0.05) {
                    this.init();
                    const osc = this.ctx.createOscillator(); const osc2 = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.type = 'sawtooth'; osc2.type = 'sine'; osc.frequency.setValueAtTime(freq, this.ctx.currentTime + offset); osc2.frequency.setValueAtTime(freq, this.ctx.currentTime + offset);
                    gain.gain.setValueAtTime(0, this.ctx.currentTime + offset);
                    gain.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + offset + attack);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + offset + duration);
                    osc.connect(gain); osc2.connect(gain); gain.connect(this.masterGain); osc.start(this.ctx.currentTime + offset); osc2.start(this.ctx.currentTime + offset);
                    osc.stop(this.ctx.currentTime + offset + duration); osc2.stop(this.ctx.currentTime + offset + duration);
                }
                playTaiko(freq, duration, vol = 0.6, offset = 0) {
                    this.init();
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.type = 'square'; osc.frequency.setValueAtTime(freq, this.ctx.currentTime + offset); osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + offset + duration * 0.5);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime + offset); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + offset + duration);
                    osc.connect(gain); gain.connect(this.masterGain); osc.start(this.ctx.currentTime + offset); osc.stop(this.ctx.currentTime + offset + duration);
                }
                playBGM(type) {
                    this.init();
                    // 同じタイプでも、再生されていなければ（pausedなら）再生を試みる
                    if (this.currentBGMType === type && this.bgms[type] && !this.bgms[type].paused) return;

                    if (this.currentBGMType && this.bgms[this.currentBGMType] && this.currentBGMType !== type) {
                        this.bgms[this.currentBGMType].pause();
                        this.bgms[this.currentBGMType].currentTime = 0;
                    }
                    this.currentBGMType = type;
                    if (!this.bgms[type]) {
                        this.bgms[type] = new Audio(this.bgmPaths[type]);
                        this.bgms[type].loop = true;
                        this.bgms[type].volume = this.volume;
                    }
                    this.bgms[type].play().catch(e => console.log("BGM Play Error:", e));
                }
                playSE(type) {
                    if (type === 'attack') this.playTaiko(180, 0.1, 0.4);
                    else if (type === 'damage') this.playTaiko(80, 0.4, 0.7);
                    else if (type === 'levelup') {
                        // 昇段ファンファーレ: 煌びやかな琴の速弾き
                        this.init();
                        [523, 659, 783, 1046].forEach((f, i) => this.playKoto(f, 0.5, 0.5, i * 0.1, 0.01));
                    }
                    else if (type === 'stairs') {
                        // 階段を上る音
                        this.init();
                        for (let i = 0; i < 4; i++) {
                            this.playTaiko(60, 0.2, 0.3, i * 0.25);
                        }
                    }
                    else if (type === 'teleport') {
                        // 転移の音
                        this.init();
                        const now = this.ctx.currentTime;
                        const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                        osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(800, now + 1);
                        gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.3, now + 0.5); gain.gain.linearRampToValueAtTime(0, now + 1);
                        osc.connect(gain); gain.connect(this.masterGain); osc.start(now); osc.stop(now + 1);
                    }
                    else if (type === 'kill') {
                        // 撃破音: 低く重厚な断末魔の響き
                        this.playTaiko(50, 0.8, 1.0);
                        this.playTaiko(40, 1.0, 0.6, 0.1);
                        // 低く沈み込むような音

                        const now = this.ctx.currentTime;

                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(30, now + 1);

                        osc2.frequency.exponentialRampToValueAtTime(2093.00, now + 0.15); // C7
                        
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                        
                        osc1.connect(gain);
                        osc2.connect(gain);
                        gain.connect(this.masterGain);
                        
                        osc1.start(now);
                        osc2.start(now);
                        osc1.stop(now + 0.15);
                        osc2.stop(now + 0.15);
                    }
                }

            async function enemyTurn(isDefending = false) {

            window.battleAction = (type) => {
                if (battleBusy) return;
                if (type === 'run') { if (enemy.n !== "下町のボス" && Math.random() > 0.5) { endBattle(); return; } else { logExploration("逃げられぬ!"); } }
                if (type === 'skill' && player.mp < 10) { logExploration("気力が足りぬ!"); return; }

                const performAction = async () => {
                    battleBusy = true;
                    let d = 0;
                    if (type === 'attack') {
                        audio.playSE('attack');
                        const slash = document.createElement('div'); slash.className = 'slash-line';
                        document.getElementById('enemy-visual').appendChild(slash);
                        setTimeout(() => slash.remove(), 400);

                        document.getElementById('enemy-visual').classList.add('shake');
                        setTimeout(() => document.getElementById('enemy-visual').classList.remove('shake'), 400);
                        d = Math.floor(Math.random() * 10) + player.atk;
                        enemy.h -= d;
                        await new Promise(r => setTimeout(r, 300));
                        logExploration(`斬撃! ${d}ダメ。`);
                    } else if (type === 'skill') {
                        audio.playSE('attack');
                        const slash1 = document.createElement('div'); slash1.className = 'slash-line';
                        slash1.style.transform = 'rotate(45deg)';
                        const slash2 = document.createElement('div'); slash2.className = 'slash-line';
                        slash2.style.transform = 'rotate(-45deg)';
                        const ev = document.getElementById('enemy-visual');
                        ev.appendChild(slash1); ev.appendChild(slash2);
                        setTimeout(() => { slash1.remove(); slash2.remove(); }, 400);

                        player.mp -= 10;
                        player.hp -= 10; // 体力も消費
                        document.getElementById('enemy-visual').classList.add('shake');
                        setTimeout(() => document.getElementById('enemy-visual').classList.remove('shake'), 400);
                        d = Math.floor(player.atk * 3.5);
                        enemy.h -= d;
                        updateUI();
                        await new Promise(r => setTimeout(r, 300));
                        logExploration(`秘奥義! ${Math.floor(d)}ダメ!`);
                    } else if (type === 'defend') {
                        logExploration("身を固めて凌ぐ! (気力5回復)");
                        player.mp = Math.min(player.maxMp, player.mp + 5);
                    }
                    updateUI();

                    if (type !== 'run' && type !== 'defend' && enemy.h <= 0) {
                        // 撃破演出
                        audio.playSE('kill');
                        const ev = document.getElementById('enemy-visual');
                        const img = document.getElementById('enemy-img');
                        const src = img.src;
                        img.style.display = 'none'; // 本体を隠す

                        const upper = document.createElement('img'); upper.src = src; upper.className = 'slice-upper';
                        upper.style.cssText = "max-width:90%; max-height:90%; object-fit:contain; filter: brightness(1.6) contrast(1.3); mix-blend-mode: multiply;";
                        const lower = document.createElement('img'); lower.src = src; lower.className = 'slice-lower';
                        lower.style.cssText = "max-width:90%; max-height:90%; object-fit:contain; filter: brightness(1.6) contrast(1.3); mix-blend-mode: multiply;";
                        ev.appendChild(upper); ev.appendChild(lower);

                        await new Promise(r => setTimeout(r, 1000));
                        
                        if (enemy.dialogueKey && bossDialogues[enemy.dialogueKey]) {
                            await displayBossDialogue(bossDialogues[enemy.dialogueKey], true);
                        }

                        logExploration(`勝利! ${enemy.g}文、功徳${enemy.e}獲得。`);
                        player.money += enemy.g; player.exp += enemy.e;
                        while (player.exp >= player.nextExp) {
                            player.lv++; player.exp -= player.nextExp;
                            player.nextExp = Math.floor(player.nextExp * 1.4);
                            player.maxHp += 40; player.mp = player.maxMp;
                            audio.playSE('levelup');
                            logExploration(`段位が${player.lv}に上昇! やる気がみなぎった!`);
                        }
                        if (enemy.n === "下町のボス") isTownBossAlive = false;
                        if (enemy.n === "野盗団の首領") { isForestBossAlive = false; logExploration("--- 森を平定した ---"); }
                        if (enemy.n === "妖怪屋敷の化け狐") { isHouseBossAlive = false; logExploration("--- 妖怪屋敷を浄化した ---"); }
                        if (enemy.n === "青鬼 (一階守護)") { isCastle1FMidBossAlive = false; logExploration("--- 一階の青鬼を討ち取った ---"); }
                        if (enemy.n === "赤鬼 (二階守護)") { isCastle2FMidBossAlive = false; logExploration("--- 二階の赤鬼を討ち取った ---"); }
                        if (enemy.n === "黒鬼 (城主)") { isCastleBossAlive = false; logExploration("--- 廃城を平定した ---"); }
                        if (enemy.n === "牛鬼 (地下二階守護)") { isAbyssMidBossAlive = false; logExploration("--- 黄泉の門番を討ち取った ---"); }
                        if (enemy.n === "邪悪な陰陽師") { isAbyssBoss1Alive = false; logExploration("--- 凶兆の源を断った ---"); }
                        if (enemy.n === "イザナミ") { isAbyssBoss2Alive = false; logExploration("--- 冥府の理を正した ---"); }
                        if (enemy.n === "よみがえりしイザナミ") { isAbyssFinalBossAlive = false; logExploration("--- 永遠の安らぎを与えた ---"); }
                        if (currentMidBossId) { houseMidBosses[currentMidBossId] = false; logExploration("--- 身代わりを討ち取った ---"); }
                        updateUI();

                        if (enemy.n === "邪悪な陰陽師") {
                            setTimeout(() => startBattle('boss2'), 2000); 
                        } else if (enemy.n === "よみがえりしイザナミ") {
                            hasPlayerClearedGame = true; 
                            setTimeout(endBattle, 1500); 
                        } else {
                            endBattle();
                        }
                    } else if (type !== 'run') {
                        await enemyTurn(type === 'defend');
                    }
                    battleBusy = false;
                    updateUI();
                };

                performAction();
            };
            function endBattle() {
                currentGameState = GameState.DUNGEON;
                battleBusy = false;
                document.getElementById('battle-overlay').style.display = 'none';
                audio.playBGM(player.currentDungeonId === 'town' ? 'dungeon' : player.currentDungeonId);
                loadMap();
                updateUI();
            }

            const mCanvas = document.getElementById('minimap-canvas'); const mCtx = mCanvas.getContext('2d');
            const fCanvas = document.getElementById('full-map-canvas'); const fCtx = fCanvas.getContext('2d');
            function drawMaps() {
                const id = player.currentDungeonId;
                const size = (id === 'town' || id === 'house' || id === 'forest') ? 16 : (id === 'castle' ? 24 : 25);
                const floorText = (id === 'town' || id === 'forest') ? '' : ` ${id === 'abyss' ? '地下' : ''}${currentFloor}階`;
                const dirArrows = ['▲', '▶', '▼', '◀'];
                mCtx.fillStyle = '#000'; mCtx.fillRect(0, 0, 150, 150);
                mCtx.textAlign = 'center'; mCtx.textBaseline = 'middle';
                for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++) {
                    const mx = player.x + dx, mz = player.z + dz, dxr = (dx + 2) * 30, dzr = (dz + 2) * 30;
                    if (mx >= 0 && mx < size && mz >= 0 && mz < size && visited[mz][mx]) {
                        mCtx.fillStyle = MAP[mz][mx] === 1 ? '#333' : (MAP[mz][mx] >= 2 ? '#852' : '#111'); mCtx.fillRect(dxr, dzr, 28, 28);
                        let ex = 1;
                        if (id === 'forest') ex = 7;
                        else if (id === 'castle') ex = 11;
                        else if (id === 'abyss') ex = 12;
                        if (mx === ex && mz === 1 && currentFloor === 1) { mCtx.fillStyle = '#0ff'; mCtx.font = '18px serif'; mCtx.fillText('⌂', dxr + 14, dzr + 14); }
                        if (MAP[mz][mx] === 2) { mCtx.fillStyle = '#fff'; mCtx.font = '16px serif'; mCtx.fillText('▲', dxr + 14, dzr + 14); }
                        if (MAP[mz][mx] === 3) { mCtx.fillStyle = '#fff'; mCtx.font = '16px serif'; mCtx.fillText('▼', dxr + 14, dzr + 14); }
                    }
                }
                mCtx.fillStyle = '#f00'; mCtx.font = '24px serif'; mCtx.fillText(dirArrows[player.dir], 75, 75);
                if (document.getElementById('full-map-overlay').style.display === 'flex') {
                    const names = { town: '治安の悪い下町', forest: '野盗のすむ森', house: '妖怪屋敷', castle: '鬼の住む廃城', abyss: '奈落洞窟' };
                    document.getElementById('full-map-title').innerText = `―― ${names[id]}${floorText} 地図 ――`;
                    fCtx.fillStyle = '#050505'; fCtx.fillRect(0, 0, 400, 400); const cs = 400 / size;
                    fCtx.textAlign = 'center'; fCtx.textBaseline = 'middle';
                    for (let z = 0; z < size; z++) for (let x = 0; x < size; x++) if (visited[z][x]) {
                        fCtx.fillStyle = MAP[z][x] === 1 ? '#444' : (MAP[z][x] >= 2 ? '#a62' : '#222'); fCtx.fillRect(x * cs, z * cs, cs - 1, cs - 1);
                        let ex = 1;
                        if (id === 'forest') ex = 7;
                        else if (id === 'castle') ex = 11;
                        else if (id === 'abyss') ex = 12;
                        if (x === ex && z === 1 && currentFloor === 1) { fCtx.fillStyle = '#0ff'; fCtx.font = (size === 16 ? '20px' : '14px') + ' serif'; fCtx.fillText('⌂', x * cs + cs / 2, z * cs + cs / 2); }
                        if (MAP[z][x] === 2) { fCtx.fillStyle = '#fff'; fCtx.font = (size === 16 ? '20px' : '14px') + ' serif'; fCtx.fillText('▲', x * cs + cs / 2, z * cs + cs / 2); }
                        if (MAP[z][x] === 3) { fCtx.fillStyle = '#fff'; fCtx.font = (size === 16 ? '20px' : '14px') + ' serif'; fCtx.fillText('▼', x * cs + cs / 2, z * cs + cs / 2); }
                    }
                    fCtx.fillStyle = '#f00'; fCtx.font = (size === 16 ? '24px' : '16px') + ' serif'; fCtx.fillText(dirArrows[player.dir], player.x * cs + cs / 2, player.z * cs + cs / 2);
                }
            }

            window.movePlayer = (action) => {
                if (currentGameState !== GameState.DUNGEON) return;
                if (document.getElementById('confirm-modal').style.display === 'block') return;

                const a = [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2][player.dir]; let nx = player.x, nz = player.z;
                if (action === 'w') { nx += Math.round(Math.sin(a)); nz -= Math.round(Math.cos(a)); }
                else if (action === 's') { nx -= Math.round(Math.sin(a)); nz += Math.round(Math.cos(a)); }
                else if (action === 'a') { player.dir = (player.dir + 3) % 4; player.targetRot += Math.PI / 2; }
                else if (action === 'd') { player.dir = (player.dir + 1) % 4; player.targetRot -= Math.PI / 2; }

                if (nx !== player.x || nz !== player.z) {
                    const nextType = MAP[nz] ? MAP[nz][nx] : 1;
                    if (nextType !== 1) {
                        player.x = nx; player.z = nz; updateMapping(); player.targetPos.set(nx * GS, 1.6, nz * GS);
                        let ex = 1;
                        if (player.currentDungeonId === 'forest') ex = 7;
                        else if (player.currentDungeonId === 'castle') ex = 11;
                        else if (player.currentDungeonId === 'abyss') ex = 12;
                        if (nx === ex && nz === 1 && currentFloor === 1) openConfirm('宿場町へ戻りますか？', returnToTown);
                        else if (player.currentDungeonId === 'castle' && currentFloor === 3 && nx === 11 && nz === 7) openConfirm('1階につながる穴があるはいりますか？', () => {
                            document.getElementById('confirm-modal').style.display = 'none';
                            enterDungeon('castle', 1);
                        });
                        else if (nextType === 2) { logExploration("上り階段だ。"); enterDungeon(player.currentDungeonId, currentFloor + 1); /* 座標維持 */ }
                        else if (nextType === 3) { logExploration("下り階段だ。"); enterDungeon(player.currentDungeonId, currentFloor - 1); /* 座標維持 */ }
                        else checkEncounter();
                    }
                    else logExploration("壁だ。");
                }
            };

            window.showMap = (visible) => {
                if (currentGameState !== GameState.DUNGEON) return;
                const overlay = document.getElementById('full-map-overlay');
                if (visible) {
                    overlay.style.display = 'flex';
                } else {
                    overlay.style.display = 'none';
                }
            };

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && currentGameState === GameState.DUNGEON) window.showMap(true);
                if (currentGameState !== GameState.DUNGEON) return;

                // モーダル表示中は移動を無視
                if (document.getElementById('confirm-modal').style.display === 'block') return;

                const key = e.key.toLowerCase();
                if (key === 'w' || e.key === 'ArrowUp') window.movePlayer('w');
                else if (key === 's' || e.key === 'ArrowDown') window.movePlayer('s');
                else if (key === 'a' || e.key === 'ArrowLeft') window.movePlayer('a');
                else if (key === 'd' || e.key === 'ArrowRight') window.movePlayer('d');
            });
            window.addEventListener('keyup', (e) => { if (e.code === 'Space') window.showMap(false); });

            function animate() {
                requestAnimationFrame(animate); if (currentGameState === GameState.TOWN) return;

                // 最短経路での回転補間
                let diffRot = player.targetRot - camera.rotation.y;
                while (diffRot > Math.PI) diffRot -= Math.PI * 2;
                while (diffRot < -Math.PI) diffRot += Math.PI * 2;
                camera.rotation.y += diffRot * 0.1;

                camera.position.lerp(player.targetPos, 0.1);
                torch.intensity = 20 + Math.sin(Date.now() * 0.007) * 7;
                bossEntity.position.y = 2.3 + Math.sin(Date.now() * 0.0025) * 0.35; bossEntity.rotation.y += 0.025;
                drawMaps(); renderer.render(scene, camera);
            }
            animate(); updateUI();
            window.onload = () => {
                document.getElementById('three-container').style.display = 'none';
                document.getElementById('minimap-container').style.display = 'none';
                // 初回操作でBGMを開始（ブラウザ制限対策）
                const startAudio = () => { audio.playBGM('town'); window.removeEventListener('click', startAudio); window.removeEventListener('keydown', startAudio); };
                window.addEventListener('click', startAudio); window.addEventListener('keydown', startAudio);
                audio.playBGM('town'); // 許可されている場合は即開始
                checkLoadBtn();
                openFacility('magistrate');
            };

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });


        </script>
</body>
